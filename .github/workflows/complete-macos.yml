name: complete-macos
on:
  workflow_dispatch:
    inputs:
      source-ref:
        required: true
        type: string
      arch:
        required: true
        type: choice
        options: [arm64, x64]
      build-run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  complete:
    name: Complete mac-${{ inputs.arch }}
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: myelnn/robovaiUSB
          ref: ${{ inputs.source-ref }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: src/tauri-spike/frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: robovai-0.1.7-mac-${{ inputs.arch }}
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}
          path: previous
      - name: Verify real DMG and restore runtime resources
        working-directory: src
        run: node tauri-spike/scripts/native-package-0.1.7.mjs from-dmg ../previous
      - name: Install and build portable frontend
        working-directory: src/tauri-spike/frontend
        run: |
          npm ci
          npm run build:usb
      - name: Package and verify portable
        working-directory: src
        run: node tauri-spike/scripts/native-package-0.1.7.mjs usb
      - name: Generate checksums
        working-directory: src
        env:
          GITHUB_SOURCE_SHA: 9b2492be1c1122e0eadf2b34353b207965de907e
        run: node tauri-spike/scripts/native-package-0.1.7.mjs manifest
      - name: Verify actual portable launcher and tools
        working-directory: src
        run: node tauri-spike/scripts/verify-portable-native-0.1.7.mjs tauri-spike/dist/native-0.1.7/mac-${{ inputs.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robovai-0.1.7-complete-mac-${{ inputs.arch }}
          path: src/tauri-spike/dist/native-0.1.7/mac-${{ inputs.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
