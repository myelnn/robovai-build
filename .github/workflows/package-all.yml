name: package-all
run-name: Package RoboVAI ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        type: string
      source-ref:
        description: Private source snapshot ref
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    working-directory: src
jobs:
  native:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            runner: macos-15
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: myelnn/robovaiUSB
          ref: ${{ inputs.source-ref }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: src/tauri-spike/frontend/package-lock.json
      - name: Validate version and platform
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('tauri-spike/src-tauri/tauri.conf.json')).version;if(v!==process.env.PACKAGE_VERSION)throw Error('Version mismatch');if(process.arch!==process.env.PACKAGE_ARCH)throw Error('Architecture mismatch');console.log(v,process.platform,process.arch)"
          echo "GITHUB_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 python3-gi gir1.2-webkit2-4.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/tauri-spike/src-tauri
          key: package-${{ matrix.platform }}-${{ matrix.arch }}
      - name: Install platform runtimes and tools
        run: node tauri-spike/backend/bin/setup.mjs
      - name: Sync runtime resources
        run: node tauri-spike/scripts/sync-resources.mjs
      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/tauri-spike/frontend
      - name: Build PC frontend
        run: npm run build:pc
        working-directory: src/tauri-spike/frontend
      - name: Package and verify desktop
        run: node tauri-spike/scripts/native-package-0.1.7.mjs pc
      - name: Build portable frontend
        run: npm run build:usb
        working-directory: src/tauri-spike/frontend
      - name: Package and verify portable
        run: node tauri-spike/scripts/native-package-0.1.7.mjs usb
      - name: Generate checksums
        run: node tauri-spike/scripts/native-package-0.1.7.mjs manifest
      - name: Save packages and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robovai-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: src/tauri-spike/dist/native-0.1.7/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
