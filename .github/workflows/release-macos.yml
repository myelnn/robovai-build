# RoboVAI macOS 发布 CI —— 隔离构建仓版（myelnn/robovai-build，公开）
#
# 本仓不含源码：构建时从私有源仓 myelnn/robovaiUSB 拉 refs/tags/v<version>
# （secrets.SOURCE_READ_TOKEN = fine-grained PAT，仅 contents:read 于该仓）。
# 源码只存在于 GitHub 临时 runner，跑完销毁，公开仓永远无源码。
# 公开仓 = GitHub Actions 免费无限（当前账号私有仓 2000min/月已用尽导致计费墙）。
#
# 触发：workflow_dispatch 输出版本号。发版流程：
#   本机 release-publish.mjs bump → git push origin v<ver>（主仓留档）→
#   本仓手动派发 release-macos，version=v<ver>。
#
# 凭据 Secrets：RVAI_RELEASE_EMAIL / RVAI_RELEASE_PASSWORD（api.robovai.com 上传建记录）、
#              SOURCE_READ_TOKEN（读私有源仓）。
#
# 产物架构默认 universal2（aarch64+x86_64 合并包，config.macTarget 控制）。

name: release-macos

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（须与主仓 tag v<version> 一致）'
        required: true
        type: string
      source-ref:
        description: '源仓 ref（默认 refs/tags/v<version>；测试可填 refs/heads/main）'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: src

jobs:
  # ── macos-usb：便携版（零 Rust exe，系统 WKWebView 开窗）──────────────────
  mac-usb:
    name: macos / usb (universal2)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout 源仓 @ tag
        uses: actions/checkout@v4
        with:
          repository: myelnn/robovaiUSB
          ref: ${{ inputs.source-ref || format('refs/tags/v{0}', inputs.version) }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/tauri-spike/frontend/package-lock.json

      - name: 下载 runtime + core（setup）
        run: node tauri-spike/backend/bin/setup.mjs

      - name: 同步 resources（sync-resources）
        run: node tauri-spike/scripts/sync-resources.mjs

      - name: 安装前端依赖
        run: npm ci
        working-directory: src/tauri-spike/frontend

      - name: 构建前端（usb 模式）
        run: npm run build:usb
        working-directory: src/tauri-spike/frontend

      - name: 发布 macos-usb
        env:
          RVAI_RELEASE_EMAIL: ${{ secrets.RVAI_RELEASE_EMAIL }}
          RVAI_RELEASE_PASSWORD: ${{ secrets.RVAI_RELEASE_PASSWORD }}
        run: |
          node tauri-spike/scripts/release/release-publish.mjs \
            --ci --skip-bump --skip-tag \
            --platform macos --form usb

  # ── macos-pc：安装版（cargo tauri build --features pc 出 dmg）─────────────
  mac-pc:
    name: macos / pc (universal2)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout 源仓 @ tag
        uses: actions/checkout@v4
        with:
          repository: myelnn/robovaiUSB
          ref: ${{ inputs.source-ref || format('refs/tags/v{0}', inputs.version) }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/tauri-spike/frontend/package-lock.json

      - name: Setup Rust（pc 形态需 cargo tauri build）
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal2 也要装：cargo tauri build --target universal2-apple-darwin 需要该 target
          targets: aarch64-apple-darwin,x86_64-apple-darwin,universal2-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/tauri-spike/src-tauri/target
          key: macos-pc-cargo-${{ hashFiles('src/tauri-spike/src-tauri/Cargo.lock') }}
          restore-keys: macos-pc-cargo-

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: 下载 runtime + core（setup）
        run: node tauri-spike/backend/bin/setup.mjs

      - name: 同步 resources（sync-resources）
        run: node tauri-spike/scripts/sync-resources.mjs

      - name: 安装前端依赖
        run: npm ci
        working-directory: src/tauri-spike/frontend

      - name: 构建前端（pc 模式）
        run: npm run build:pc
        working-directory: src/tauri-spike/frontend

      - name: 发布 macos-pc
        env:
          RVAI_RELEASE_EMAIL: ${{ secrets.RVAI_RELEASE_EMAIL }}
          RVAI_RELEASE_PASSWORD: ${{ secrets.RVAI_RELEASE_PASSWORD }}
        run: |
          # --mac-target aarch64：新版 Rust stable 已移除 universal2-apple-darwin
          # rust-std（tauri 一键 universal2 不可用），先出 arm64 dmg（runner 原生架构）。
          node tauri-spike/scripts/release/release-publish.mjs \
            --ci --skip-bump --skip-tag \
            --mac-target aarch64 \
            --platform macos --form pc
